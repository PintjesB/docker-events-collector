name: Docker events collector CI and SemVer releases

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: docker-events-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Go and automatic release tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Run Go tests and static analysis
        run: |
          go test -race -count=1 ./...
          go vet ./...
      - name: Test automated SemVer calculation
        run: python3 -m unittest discover -s tests -v

  build-pr:
    name: Verify AMD64 and ARM64 images
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build without publishing
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false

  publish:
    name: Release next SemVer image to GHCR
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: docker-events-ghcr-release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Calculate new version from latest immutable Git tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          python3 scripts/release_version.py --github-output "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        if: steps.release.outputs.publish == 'true'
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        if: steps.release.outputs.publish == 'true'
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        if: steps.release.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable versioned multi-arch image
        if: steps.release.outputs.publish == 'true'
        id: image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/pintjesb/docker-events-collector:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/PintjesB/docker-events-collector
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Create release Git tag only after publication
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/v${RELEASE_VERSION}" -f sha="${GITHUB_SHA}" >/dev/null
      - name: Report release and digest
        if: steps.release.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "Published ghcr.io/pintjesb/docker-events-collector:${VERSION}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
